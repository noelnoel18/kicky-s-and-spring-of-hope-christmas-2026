/* LUXURY CHRISTMAS ENVELOPE OVERLAY */
#envOverlay{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(circle at 50% 35%, #23533b 0%, #10281c 75%, #091710 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;
  transition:opacity .95s ease, visibility .95s ease;
}
#envOverlay.opened{opacity:0;visibility:hidden;pointer-events:none}
.env-caption{
  color:var(--gold-bright);font-size:12px;letter-spacing:.28em;text-transform:uppercase;
  margin-bottom:18px;text-align:center;opacity:.9;
}
.env-stage{
  position:relative;z-index:1000;
  width:min(440px,92vw);aspect-ratio:4/2.85;
  perspective:1200px;cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.env-body{

  overflow:visible;
}
